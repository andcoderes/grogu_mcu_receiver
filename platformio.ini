; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32c6

[env:seeed_xiao_esp32c6]
platform = espressif32
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
; Board has 4MB flash. The default partition table splits it into two ~1.25MB
; OTA app slots, too small for BLE+WiFi+ArduinoJson (~1.38MB built). grogu
; doesn't do OTA, so use a single ~3MB app partition instead.
board_build.partitions = huge_app.csv
extra_scripts = pre:scripts/load_secrets.py
build_flags =
	-D FIRMWARE_VERSION='"0.1.0"'
lib_deps =
	bblanchon/ArduinoJson@7.4.3
